<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Ladybird SDE UI test</title>
        <style>
            body { margin: 0; padding: 2rem; background: #f4f7fb; color: #102030; font-family: sans-serif; }
            label { display: block; margin-top: 1.5rem; font-weight: bold; }
            select, input { margin-top: 0.5rem; font-size: 1rem; }
            a { color: #0033cc; }
            .box { margin-top: 1.5rem; padding: 1rem; background: white; border: 1px solid #b8c4d4; }
        </style>
    </head>
    <body>
        <h1>Ladybird SDE UI test</h1>
        <p><a href="https://example.com">A link for the context menu</a></p>

        <div class="box">
            <label for="choice">Select dropdown</label>
            <select id="choice">
                <option>First option</option>
                <option selected>Second option</option>
                <option disabled>Disabled option</option>
                <option>Fourth option</option>
            </select>

            <label for="file">File picker</label>
            <input id="file" type="file" />

            <label>Download</label>
            <p><a href="data:text/plain,Ladybird%20SDE%20download%0A" download="ladybird-sde-download.txt">Download a data URL</a></p>
        </div>
    </body>
</html>
